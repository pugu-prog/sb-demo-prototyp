.empty{text-align:center;color:var(--muted);padding:30px 0}

/* --- Mäi Beräich --- */
function vMb(){
  var att=TR.filter(function(t){return isPast(t.date)&&attOf(t)[0];});
  var inY=att.filter(function(t){return t.date.slice(0,4)===String(S.year);});
  var months={};inY.forEach(function(t){var k=+t.date.slice(5,7)-1;months[k]=(months[k]||0)+1;});
  var max=Math.max.apply(null,Object.values(months).concat([1]));
  var h='<div class="card" data-a="an" style="cursor:pointer"><div class="row"><div class="sp"><h3 style="margin:0 0 4px">Meng Auswäertung'+nei()+'</h3><div class="muted sm">Lafen · Vëlo · Schwammen: Pace, Leeschtung, Zonen</div></div><span class="chev">›</span></div></div><div class="card"><h3>Trainings besicht'+nei()+'</h3><div class="row"><div style="font-size:42px;font-weight:800;color:var(--sunt)">'+inY.length+'</div><div class="muted">Trainings am Joer '+S.year+'</div></div><div style="margin-top:10px">';
  for(var m=8;m<=10;m++){var n=months[m]||0;h+='<div class="row" style="margin:6px 0"><div style="width:84px" class="sm">'+MON[m]+'</div><div class="sp"><div class="bar" style="width:'+Math.round(n/max*100)+'%"></div></div><b>'+n+'</b></div>';}
  h+='<div class="muted sm" style="margin-top:8px">Nëmmen du gesäis dës Zuelen.</div></div>';
  h+='<div class="card"><h3>Meng Trainings</h3>'+att.slice().reverse().slice(0,12).map(function(t){return '<div class="li row"><div class="sp"><div>'+esc(t.title)+'</div><div class="muted sm">'+longDate(t.date)+'</div></div><span class="badge b-'+lvlCls(t.lvl)+'">'+t.lvl+'</span></div>';}).join("")+'<div class="muted sm" style="margin-top:8px">… nëmmen déi lescht 12 gewisen</div></div>';
  var mine=S.res.filter(function(r){return r.rid===0;}),best={};
  mine.forEach(function(r){if(!best[r.dist]||toSec(r.time)<toSec(best[r.dist].time))best[r.dist]=r;});
  h+='<div class="card"><h3>Meng Beschtzäiten</h3>'+(Object.keys(best).map(function(k){return '<div class="li row"><div class="sp">'+esc(k)+'</div><b style="color:var(--sunt)">'+esc(best[k].time)+'</b></div>';}).join("")||'<div class="muted">Nach keng.</div>')+'</div>';
  h+='<div class="card"><h3>Meng Resultater</h3>'+mine.map(function(r){var c=coById(r.cid);return '<div class="li row" data-a="co" data-v="'+c.id+'" style="cursor:pointer"><div class="sp">'+esc(c.name)+'<div class="muted sm">'+longDate(c.date)+' · '+esc(r.dist)+' · Plaz '+esc(r.place)+'</div></div><b style="color:var(--sunt)">'+esc(r.time)+'</b></div>';}).join("")+'</div>';
  h+='<div class="card" style="border-style:dashed;text-align:center" ><div class="muted">⌚ Spéider: Daten-Import (Garmin/Coros)</div></div>';
  return h;}

function vFg(){

  else{body={cal:vCal,tr:vTr,co:vCo,pr:vProf}[S.tab]();}
  var hd;

    hd=hd||'<header><span class="logo" role="img" aria-label="SauerBeen"></span><span class="sp"></span>'+right+langBtn+'</header>';}
  var tabs=[["cal","Kalenner","cal"],["tr","Training","heart"],["co","Coursen","cup"],["pr","Profil","user"]];
  var scroll=document.querySelector("main"),st=scroll?scroll.scrollTop:0;
  var app=document.getElementById("app"),ov=document.getElementById("ov");
  app.innerHTML=hd+'<main>'+body+'</main><nav>'+tabs.map(function(t){return '<button class="'+(S.tab===t[0]?"on":"")+'" data-a="tab" data-v="'+t[0]+'">'+ic(t[2])+t[1]+'</button>';}).join("")+'</nav>';
  applyI18n(app);
